name: Build Lucky Bean Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not configured on the runner}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Validate web source
        run: |
          npm test
          npm run check

      - name: Build installable Debug APK
        run: gradle -p android --no-daemon :app:assembleDebug

      - name: Verify APK signature and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | tee android/app/build/outputs/apk/debug/apk-badging.txt
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/LuckyBean-v0.6.0-debug.apk.sha256
          cp "$APK" android/app/build/outputs/apk/debug/LuckyBean-v0.6.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuckyBean-v0.6.0-Android-debug
          path: |
            android/app/build/outputs/apk/debug/LuckyBean-v0.6.0-debug.apk
            android/app/build/outputs/apk/debug/LuckyBean-v0.6.0-debug.apk.sha256
            android/app/build/outputs/apk/debug/apk-badging.txt
          if-no-files-found: error
          retention-days: 30
