name: Verify Lucky Bean 099d

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-v099d.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Syntax checks
        run: |
          node --check src/v095-sensory-bootstrap.js
          node --check src/v095-sensory-pro.js
          node --check src/v099d-radar-scroll.js
          node --check src/v099d-ocr-quality.js
          node --check src/v099d-supabase-auth.js
      - name: OCR immutable base smoke test
        run: |
          node --input-type=module <<'JS'
          let calls = 0;
          globalThis.LuckyBeanWebOCR = {
            async recognizeCoffeeBag(images) {
              calls += 1;
              return {
                results: images.map(image => ({ imageId: image.id, value: { blocks: [{ text: '埃塞俄比亚 水洗 瑰夏 海拔 2000m 烘焙日期 2026-08-01', confidence: .93 }] } }))
              };
            }
          };
          globalThis.document = { documentElement: { dataset: {} }, createElement(){ throw new Error('unexpected rotation'); } };
          globalThis.CustomEvent = class { constructor(type, init){ this.type = type; this.detail = init?.detail; } };
          globalThis.dispatchEvent = () => {};
          await import(`./src/v099d-ocr-quality.js?test=${Date.now()}`);
          const result = await globalThis.LuckyBeanWebOCR.recognizeCoffeeBag([{ id: 'front', blob: {} }]);
          if (calls !== 1) throw new Error(`base OCR called ${calls} times`);
          if (!result.fullText.includes('水洗') || !result.engine.includes('099d')) throw new Error('099d OCR result invalid');
          JS
      - name: Targeted release tests
        run: node --test tests/v099d-release.test.mjs
      - name: Record verification
        run: |
          cat > tests/v099d-status.json <<'EOF'
          {
            "verified": true,
            "version": "0.9.9",
            "revision": "099d",
            "checks": [
              "sensory-syntax",
              "radar-scroll-preservation",
              "ocr-immutable-base-call",
              "ocr-Chinese-priority-pass",
              "ocr-orientation-fallback",
              "Supabase-public-auth",
              "publication-cache-boundary"
            ]
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/v099d-status.json
          git commit -m "chore: record verified Lucky Bean 099d [skip ci]"
          git push origin HEAD:main
