name: Apply and verify OCR QR regression fix

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-v096-ocr-qr-fix.py'
      - 'src/v096-web-ocr.js'
      - 'tests/v096-ocr-qr-regression.test.mjs'
      - 'tests/ocr-qr-regression-smoke.py'
      - '.github/workflows/apply-v096-ocr-qr-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luckybean-ocr-qr-regression
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic runtime patch
        run: python tools/apply-v096-ocr-qr-fix.py

      - name: Run static and unit regression tests
        run: |
          set -euo pipefail
          npm test
          npm run check
          node --check src/qr.js
          node --check src/v096-web-ocr.js
          node --check src/v096-package-capture.js
          grep -q "luckybean-v0.9.6-ocr-qr-c" sw.js
          grep -q "src/v096-web-ocr.js?v=096c" index.html
          grep -q "worker-src 'self' blob: https://cdn.jsdelivr.net" index.html

      - name: Install Chromium runtime
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Run real browser OCR and QR regression smoke
        run: python tests/ocr-qr-regression-smoke.py | tee /tmp/ocr-qr-regression.log

      - name: Commit verified runtime patch
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js README.md src/qr.js src/v096-package-capture.js src/v096-web-ocr.js tests/static-check.mjs tests/v096-ocr-qr-regression.test.mjs tests/ocr-qr-regression-smoke.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: enable browser OCR and prevent false QR CRC errors'
            git push origin HEAD:main
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record verified source status
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.runtime.outputs.source_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          status = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ['SOURCE_SHA'],
              'static_tests': 'success',
              'browser_runtime': 'success',
              'real_web_ocr_smoke': 'success',
              'qr_text_first_regression': 'success',
              'verified': True,
          }
          with open('tests/ocr-qr-regression-status.json', 'w', encoding='utf-8') as handle:
              json.dump(status, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY
          git pull --rebase origin main
          git add tests/ocr-qr-regression-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record OCR and QR regression verification [skip ci]'
            git push origin HEAD:main
          fi

# retriggered after the workflow existed on main
