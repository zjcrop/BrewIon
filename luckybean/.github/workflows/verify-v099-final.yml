name: Verify Lucky Bean v0.9.9 final

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-v099-final.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run v0.9.9 targeted tests
        run: |
          node --test tests/v099-upgrade.test.mjs
          node --test tests/v099-trajectory-actual.test.mjs

      - name: Record verified source
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          cat > tests/v099-final-status.json <<EOF
          {
            "verified": true,
            "source_sha": "${SOURCE_SHA}",
            "version": "0.9.9",
            "revision": "099b",
            "checks": [
              "one-pour-single-stage",
              "33666-five-stage-exact-split",
              "non-recursive-group-menu",
              "repeat-recommendation-guard",
              "eight-axis-radar",
              "defect-scoring",
              "theme-readability",
              "modeled-extraction-signal-bridge"
            ]
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/v099-final-status.json
          git commit -m "chore: record verified Lucky Bean v0.9.9 release [skip ci]"
          git push origin HEAD:main
