name: Verify QR OCR brew integrity and sensory privacy

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'styles-qr-scan.css'
      - 'styles-v096-recognition.css'
      - 'styles-v096-integrity.css'
      - 'styles-v097-fixes.css'
      - 'src/qr.js'
      - 'src/qr-core.js'
      - 'src/codebook.js'
      - 'src/recognition-candidates.js'
      - 'src/v096-web-ocr.js'
      - 'src/recognition-bridge.js'
      - 'src/v096-package-capture.js'
      - 'src/v096-direct-camera.js'
      - 'src/v096-integrity-ui.js'
      - 'src/v097-ui-fixes.js'
      - 'src/v095-qr-ui.js'
      - 'src/v095-postbrew-sensory.js'
      - 'src/brew-engine.js'
      - 'src/brew-engine-core.js'
      - 'src/brew-trajectory-v096.js'
      - 'src/brew-optimizer-v097.js'
      - 'src/db.js'
      - 'src/db-storage-core.js'
      - 'src/sensory-codec-v096.js'
      - 'src/privacy-codec-v096.js'
      - 'src/share-codec.js'
      - 'src/share-codec-core.js'
      - 'tests/theme-light.test.mjs'
      - 'tests/v092.test.mjs'
      - 'tests/v093.test.mjs'
      - 'tests/v095.test.mjs'
      - 'tests/v095-refine.test.mjs'
      - 'tests/v096-qr-postbrew.test.mjs'
      - 'tests/v096-ocr-qr-regression.test.mjs'
      - 'tests/v096-integrity.test.mjs'
      - 'tests/v097-optimizer.test.mjs'
      - 'tests/v097-ui-fixes.test.mjs'
      - 'tests/postbrew-qr-smoke.py'
      - 'tests/ocr-qr-regression-smoke.py'
      - 'tests/integrity-browser-smoke.py'
      - '.github/workflows/qr-postbrew-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luckybean-integrity-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run static and unit tests
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            npm test
            npm run check
            for file in \
              src/qr.js src/qr-core.js src/codebook.js src/recognition-candidates.js \
              src/v096-web-ocr.js src/v096-package-capture.js src/v096-direct-camera.js src/v096-integrity-ui.js src/v097-ui-fixes.js \
              src/brew-engine.js src/brew-engine-core.js src/brew-trajectory-v096.js src/brew-optimizer-v097.js \
              src/db.js src/db-storage-core.js src/sensory-codec-v096.js src/privacy-codec-v096.js \
              src/share-codec.js src/share-codec-core.js src/v095-qr-ui.js src/v095-postbrew-sensory.js; do
              node --check "$file"
            done
          } > tests/qr-postbrew-static-log.txt 2>&1

      - name: Install browser test runtime and Chinese fonts
        id: install
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Verify post-brew and QR UI in Chromium
        id: browser
        continue-on-error: true
        if: steps.install.outcome == 'success'
        run: python tests/postbrew-qr-smoke.py > tests/qr-postbrew-browser-log.txt 2>&1

      - name: Verify real Chinese-English OCR and text-first QR decoding
        id: ocr
        continue-on-error: true
        if: steps.install.outcome == 'success'
        run: python tests/ocr-qr-regression-smoke.py > tests/ocr-qr-regression-log.txt 2>&1

      - name: Verify encrypted records compact history and tasting selection
        id: integrity
        continue-on-error: true
        if: steps.install.outcome == 'success'
        run: python tests/integrity-browser-smoke.py > tests/integrity-browser-log.txt 2>&1

      - name: Write verification status
        if: always()
        shell: bash
        env:
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          OCR_OUTCOME: ${{ steps.ocr.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          static = os.environ.get('STATIC_OUTCOME', 'skipped')
          install = os.environ.get('INSTALL_OUTCOME', 'skipped')
          browser = os.environ.get('BROWSER_OUTCOME', 'skipped')
          ocr = os.environ.get('OCR_OUTCOME', 'skipped')
          integrity = os.environ.get('INTEGRITY_OUTCOME', 'skipped')
          checked_at = datetime.now(timezone.utc).isoformat()
          source_sha = os.environ['GITHUB_SHA']
          qr_result = {
              'checked_at': checked_at,
              'source_sha': source_sha,
              'static_tests': static,
              'browser_runtime': install,
              'postbrew_qr_browser_smoke': browser,
              'verified': static == install == browser == 'success',
          }
          ocr_result = {
              'checked_at': checked_at,
              'source_sha': source_sha,
              'static_tests': static,
              'browser_runtime': install,
              'real_web_ocr_smoke': ocr,
              'qr_text_first_regression': static,
              'chinese_mixed_ocr': ocr,
              'direct_camera_static': static,
              'field_autofill_static': static,
              'verified': static == install == ocr == 'success',
          }
          integrity_result = {
              'checked_at': checked_at,
              'source_sha': source_sha,
              'static_tests': static,
              'browser_runtime': install,
              'integrity_browser_smoke': integrity,
              'brew_profile_integrity': static,
              'manual_segment_constraint': static,
              'legacy_trajectory_rendering': static,
              'variable_trajectory': static,
              'sensory_encrypted_storage': integrity,
              'sensory_rich_history': integrity,
              'compact_brew_history': integrity,
              'minimal_identity_screen': integrity,
              'direct_sensory_choice': integrity,
              'verified': static == install == integrity == 'success',
          }
          for path, result in (
              ('tests/qr-postbrew-browser-status.json', qr_result),
              ('tests/ocr-qr-regression-status.json', ocr_result),
              ('tests/integrity-browser-status.json', integrity_result),
          ):
              with open(path, 'w', encoding='utf-8') as handle:
                  json.dump(result, handle, ensure_ascii=False, indent=2)
                  handle.write('\n')
          print(json.dumps({'qr_postbrew': qr_result, 'ocr_qr': ocr_result, 'integrity': integrity_result}, ensure_ascii=False, indent=2))
          PY

      - name: Commit verification status and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/qr-postbrew-browser-status.json tests/ocr-qr-regression-status.json tests/integrity-browser-status.json
          for file in tests/qr-postbrew-static-log.txt tests/qr-postbrew-browser-log.txt tests/ocr-qr-regression-log.txt tests/integrity-browser-log.txt; do
            if [[ -f "$file" ]]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Lucky Bean integrity verification [skip ci]'
            git push origin HEAD:main
          fi

      - name: Enforce verification result
        if: always()
        shell: bash
        env:
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          OCR_OUTCOME: ${{ steps.ocr.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
        run: |
          test "$STATIC_OUTCOME" = success
          test "$INSTALL_OUTCOME" = success
          test "$BROWSER_OUTCOME" = success
          test "$OCR_OUTCOME" = success
          test "$INTEGRITY_OUTCOME" = success
