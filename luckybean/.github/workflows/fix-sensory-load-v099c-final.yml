name: Final sensory module repair v0.9.9-099c

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-sensory-load-v099c-final.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/v095-sensory-pro.js')
          text = p.read_text(encoding='utf-8')
          bad = "return lines.join('\n');"
          good = r"return lines.join('\n');"
          if bad in text:
              text = text.replace(bad, good, 1)
          if good not in text:
              raise SystemExit('failed to repair broken summary newline')
          p.write_text(text, encoding='utf-8')

          p = Path('src/v095-sensory-bootstrap.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace('sensory-bootstrap-20260802b', 'sensory-bootstrap-20260803c')
          text = text.replace('./v095-sensory-pro.js?v=095f', './v095-sensory-pro.js?v=099c')
          text = text.replace(
              "  } catch (error) {\n    showFailure(`专业品鉴模块加载失败：${error.message}`);",
              "  } catch (error) {\n    importPromise = null;\n    showFailure(`专业品鉴模块加载失败：${error.message}`);"
          )
          text = text.replace(
              "slot.querySelector('[data-retry-sensory]')?.addEventListener('click', () => location.reload());",
              "slot.querySelector('[data-retry-sensory]')?.addEventListener('click', () => { importPromise = null; slot.remove(); queueSync(); });"
          )
          if './v095-sensory-pro.js?v=099c' not in text:
              raise SystemExit('failed to update sensory import revision')
          p.write_text(text, encoding='utf-8')

          for path in ['index.html', 'manifest.webmanifest', 'sw.js']:
              p = Path(path)
              p.write_text(p.read_text(encoding='utf-8').replace('099b', '099c'), encoding='utf-8')

          p = Path('sw.js')
          text = p.read_text(encoding='utf-8')
          marker = "  `./src/v095-sensory-bootstrap.js?v=${RELEASE}`,"
          if 'v095-sensory-pro.js?v=${RELEASE}' not in text:
              text = text.replace(marker, marker + "\n  `./src/v095-sensory-pro.js?v=${RELEASE}`,", 1)
          if 'v095-sensory-pro.js?v=${RELEASE}' not in text:
              raise SystemExit('failed to add sensory module to service worker cache')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify repaired module
        shell: bash
        run: |
          set -euo pipefail
          node --check src/v095-sensory-pro.js
          node --check src/v095-sensory-bootstrap.js
          node --input-type=module <<'JS'
          globalThis.document = {
            querySelector(){ return null; },
            querySelectorAll(){ return []; },
            addEventListener(){},
            documentElement: {}
          };
          globalThis.MutationObserver = class {
            observe(){}
            disconnect(){}
          };
          globalThis.requestAnimationFrame = () => 1;
          await import(`./src/v095-sensory-pro.js?verified=${Date.now()}`);
          console.log('sensory module import verified');
          JS
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          const pro = await readFile('src/v095-sensory-pro.js', 'utf8');
          const bootstrap = await readFile('src/v095-sensory-bootstrap.js', 'utf8');
          const index = await readFile('index.html', 'utf8');
          const sw = await readFile('sw.js', 'utf8');
          if (!pro.includes("return lines.join('\\n');")) throw new Error('newline escape missing');
          if (!bootstrap.includes('./v095-sensory-pro.js?v=099c')) throw new Error('bootstrap revision missing');
          if (!index.includes('release-revision" content="099c')) throw new Error('page revision missing');
          if (!sw.includes('luckybean-v0.9.9-main-099c')) throw new Error('cache revision missing');
          if (!sw.includes('v095-sensory-pro.js?v=${RELEASE}')) throw new Error('sensory cache entry missing');
          JS

      - name: Record verified status
        shell: bash
        run: |
          cat > tests/sensory-load-fix-status.json <<'EOF'
          {
            "verified": true,
            "version": "0.9.9",
            "revision": "099c",
            "checks": [
              "sensory-module-syntax",
              "sensory-module-dynamic-import",
              "escaped-summary-newline",
              "bootstrap-cache-revision",
              "service-worker-sensory-cache"
            ]
          }
          EOF

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v095-sensory-pro.js src/v095-sensory-bootstrap.js index.html manifest.webmanifest sw.js tests/sensory-load-fix-status.json
          git commit -m "fix: restore sensory module loading in v0.9.9-099c"
          git push origin HEAD:main
