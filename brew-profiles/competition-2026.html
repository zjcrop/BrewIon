const sel=document.getElementById('profile'),dose=document.getElementById('dose'),view=document.getElementById('view');
function esc(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function distribute(vals,scale,total){const ex=vals.map(v=>v*scale),out=ex.map(Math.floor);let d=total-out.reduce((a,b)=>a+b,0);const ord=ex.map((v,i)=>[i,v-out[i]]).sort((a,b)=>b[1]-a[1]);for(let i=0;i<d;i++)out[ord[i%ord.length][0]]++;return out}
function render(){const p=profiles[sel.selectedIndex],r=p.recipe.reference,d=Number(dose.value||r.dose),scale=d/r.dose,total=Math.round(r.totalWater*scale),stages=distribute(r.stageAmounts,scale,total);let cum=0;view.innerHTML=`<article class="card"><h2>${esc(p.label)}</h2><dl><dt>选手/名次</dt><dd>${esc(p.competition.competitor)} / 第${p.competition.rank}</dd><dt>咖啡豆</dt><dd>${esc(p.competition.bean.estate)} · ${esc(p.competition.bean.variety)} · ${esc(p.competition.bean.process)} · ${esc(p.competition.bean.altitude)}</dd><dt>烘焙</dt><dd>${esc(p.competition.roast.device)} · ${esc(p.competition.roast.duration)} · 色值${esc(p.competition.roast.reportedColorValue)}</dd><dt>器具</dt><dd>${esc(p.competition.equipment.dripper)} + ${esc(p.competition.equipment.filter)}</dd><dt>研磨</dt><dd>${esc(p.competition.grinder)}</dd><dt>粉水</dt><dd>${d}g / ${total}g · 1:${(total/d).toFixed(2)}</dd><dt>水质</dt><dd>${esc(p.competition.water.tdsPpm)}ppm · ${esc(p.competition.water.description)} · pH ${esc(p.competition.water.ph)}</dd><dt>总时间</dt><dd>${r.totalTimeSeconds}s（仅参考粉量有来源支持）</dd><dt>风味</dt><dd>${p.competition.sensory.flavor.map(esc).join('、')}</dd></dl><div class="stages">${stages.map((v,i)=>{cum+=v;const t=r.temperatures[i]??r.temperatures[r.temperatures.length-1];return `<div class="stage"><span>${esc(p.recipe.stageNames[i])}</span><strong>${v}g / 累计${cum}g / ${t}℃</strong></div>`}).join('')}</div></article><article class="card"><h2>数据可信度</h2><p class="${r.stageAmountsSource.includes('reconstructed')?'reconstructed':'exact'}">阶段水量：${esc(r.stageAmountsSource)}</p><p class="${r.temperatureSource.includes('interpolated')?'reconstructed':'exact'}">温度：${esc(r.temperatureSource)}</p><p class="warning">逐段时间：${esc(r.timingSource)}；流量：${esc(r.flowSource)}</p><p>${p.competition.source.notes.map(esc).join('<br>')||'来源图未附加其他说明。'}</p><p><code>${esc(p.id)}</code></p></article>`}
if(profiles.length){profiles.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.label;sel.appendChild(o)});function sync(){dose.value=profiles[sel.selectedIndex].recipe.reference.dose;render()}sel.addEventListener('change',sync);dose.addEventListener('input',render);sync()}else{view.innerHTML='<article class="card"><h2>等待构建注入</h2><p>该模板需要通过 scripts/build-web-app.mjs 生成发布页面。</p></article>'}</script></body></html>
