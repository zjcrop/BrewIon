name: Publish Lucky Bean stable web

on:
  push:
    branches: [main]
    paths:
      - '.luckybean-publish-trigger'
      - '.github/workflows/publish-luckybean-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-luckybean-web
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout BrewIon Pages repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout Lucky Bean main
        uses: actions/checkout@v4
        with:
          repository: zjcrop/luckybean
          ref: main
          path: _luckybean_source

      - name: Validate Lucky Bean v0.9.6 source
        working-directory: _luckybean_source
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          node --check src/app.js
          node --check src/v096-package-capture.js
          node --check src/image-quality.js
          node --check src/recognition-bridge.js
          node --check src/v095-ui.js
          node --check src/theme-bridge.js
          node --check src/v095-layout-gear.js
          node --check src/v095-sensory-pro.js
          test "$(node -p "require('./package.json').version")" = '0.9.6'
          test -s index.html
          test -s styles.css
          test -s styles-v095.css
          test -s styles-action-grid.css
          test -s styles-theme-light.css
          test -s styles-v095-refine.css
          test -s styles-v096-recognition.css
          test -s src/app.js
          test -s src/v096-package-capture.js
          test -s src/image-quality.js
          test -s src/recognition-bridge.js
          test -s src/v095-ui.js
          test -s src/theme-bridge.js
          test -s src/v095-layout-gear.js
          test -s src/v095-sensory-pro.js
          test -s public/fallback-codebook.json
          test -s public/splash-red.jpg
          test -s public/splash-white.jpg
          test -s public/settings-mascot.png
          test -s public/action-grid.svg
          grep -q 'styles-v096-recognition.css' index.html
          grep -q 'src/v096-package-capture.js' index.html
          grep -q '拍袋录入' src/v096-package-capture.js
          grep -q 'PackageRecognitionBridge' src/recognition-bridge.js
          grep -q 'analyzeImageQuality' src/image-quality.js
          grep -q '专业品鉴' src/v095-sensory-pro.js
          grep -q '玩家互动品鉴' src/v095-sensory-pro.js
          grep -q '手冲常用刻度范围' src/v095-layout-gear.js
          grep -q 'luckybean-v0.9.6-recognition-a' sw.js
          grep -q "'./styles-v096-recognition.css'" sw.js
          grep -q "'./src/v096-package-capture.js'" sw.js
          grep -q "'./src/image-quality.js'" sw.js
          grep -q "'./src/recognition-bridge.js'" sw.js

      - name: Publish runtime under BrewIon/luckybean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf luckybean
          mkdir -p luckybean
          cp _luckybean_source/index.html luckybean/
          cp _luckybean_source/styles.css luckybean/
          cp _luckybean_source/styles-v095.css luckybean/
          cp _luckybean_source/styles-action-grid.css luckybean/
          cp _luckybean_source/styles-theme-light.css luckybean/
          cp _luckybean_source/styles-v095-refine.css luckybean/
          cp _luckybean_source/styles-v096-recognition.css luckybean/
          cp _luckybean_source/manifest.webmanifest luckybean/
          cp _luckybean_source/sw.js luckybean/
          cp -R _luckybean_source/src luckybean/
          cp -R _luckybean_source/public luckybean/
          touch luckybean/.nojekyll

          source_sha="$(git -C _luckybean_source rev-parse HEAD)"
          app_version="$(node -p "require('./_luckybean_source/package.json').version")"
          echo "LUCKYBEAN_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "LUCKYBEAN_VERSION=$app_version" >> "$GITHUB_ENV"

          cat > luckybean/release.json <<EOF
          {
            "name": "Lucky Bean Web Stable",
            "version": "$app_version",
            "source_repository": "zjcrop/luckybean",
            "source_sha": "$source_sha",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "url": "https://zjcrop.github.io/BrewIon/luckybean/"
          }
          EOF
          rm -rf _luckybean_source

      - name: Commit verified web release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add luckybean
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish verified Lucky Bean web stable v${LUCKYBEAN_VERSION}"
            git push origin HEAD:main
          fi

      - name: Verify public Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://zjcrop.github.io/BrewIon/luckybean/'
          ok='false'
          index_code='000'; app_code='000'; package_code='000'; quality_code='000'; bridge_code='000'
          ui_code='000'; layout_code='000'; sensory_code='000'; recognition_css_code='000'; codebook_code='000'; release_code='000'
          release_version=''; release_source_sha=''

          for attempt in $(seq 1 24); do
            nonce="$(date +%s)-$attempt"
            index_code="$(curl -L -sS -o /tmp/lb-index.html -w '%{http_code}' --max-time 20 "${base}?v=${nonce}" || true)"
            app_code="$(curl -L -sS -o /tmp/lb-app.js -w '%{http_code}' --max-time 20 "${base}src/app.js?v=${nonce}" || true)"
            package_code="$(curl -L -sS -o /tmp/lb-package.js -w '%{http_code}' --max-time 20 "${base}src/v096-package-capture.js?v=${nonce}" || true)"
            quality_code="$(curl -L -sS -o /tmp/lb-quality.js -w '%{http_code}' --max-time 20 "${base}src/image-quality.js?v=${nonce}" || true)"
            bridge_code="$(curl -L -sS -o /tmp/lb-bridge.js -w '%{http_code}' --max-time 20 "${base}src/recognition-bridge.js?v=${nonce}" || true)"
            ui_code="$(curl -L -sS -o /tmp/lb-ui.js -w '%{http_code}' --max-time 20 "${base}src/v095-ui.js?v=${nonce}" || true)"
            layout_code="$(curl -L -sS -o /tmp/lb-layout.js -w '%{http_code}' --max-time 20 "${base}src/v095-layout-gear.js?v=${nonce}" || true)"
            sensory_code="$(curl -L -sS -o /tmp/lb-sensory.js -w '%{http_code}' --max-time 20 "${base}src/v095-sensory-pro.js?v=${nonce}" || true)"
            recognition_css_code="$(curl -L -sS -o /tmp/lb-recognition.css -w '%{http_code}' --max-time 20 "${base}styles-v096-recognition.css?v=${nonce}" || true)"
            codebook_code="$(curl -L -sS -o /tmp/lb-codebook.json -w '%{http_code}' --max-time 20 "${base}public/fallback-codebook.json?v=${nonce}" || true)"
            release_code="$(curl -L -sS -o /tmp/lb-release.json -w '%{http_code}' --max-time 20 "${base}release.json?v=${nonce}" || true)"

            if [[ "$release_code" == '200' ]]; then
              release_version="$(python -c "import json; print(json.load(open('/tmp/lb-release.json', encoding='utf-8')).get('version', ''))" || true)"
              release_source_sha="$(python -c "import json; print(json.load(open('/tmp/lb-release.json', encoding='utf-8')).get('source_sha', ''))" || true)"
            fi

            if [[ "$index_code" == '200' && "$app_code" == '200' && "$package_code" == '200' \
              && "$quality_code" == '200' && "$bridge_code" == '200' && "$ui_code" == '200' \
              && "$layout_code" == '200' && "$sensory_code" == '200' && "$recognition_css_code" == '200' \
              && "$codebook_code" == '200' && "$release_code" == '200' \
              && "$release_version" == "$LUCKYBEAN_VERSION" && "$release_source_sha" == "$LUCKYBEAN_SOURCE_SHA" ]] \
              && grep -q 'styles-v096-recognition.css' /tmp/lb-index.html \
              && grep -q 'src/v096-package-capture.js' /tmp/lb-index.html \
              && grep -q '拍袋录入' /tmp/lb-package.js \
              && grep -q 'PackageRecognitionBridge' /tmp/lb-bridge.js \
              && grep -q 'analyzeImageQuality' /tmp/lb-quality.js \
              && grep -q '手冲常用刻度范围' /tmp/lb-layout.js \
              && grep -q '专业品鉴' /tmp/lb-sensory.js \
              && grep -q '"countries"' /tmp/lb-codebook.json; then
              ok='true'
              break
            fi
            sleep 10
          done

          export ok index_code app_code package_code quality_code bridge_code ui_code layout_code sensory_code recognition_css_code codebook_code release_code release_version release_source_sha base
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          report = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'url': os.environ['base'],
              'expected_version': os.environ['LUCKYBEAN_VERSION'],
              'expected_source_sha': os.environ['LUCKYBEAN_SOURCE_SHA'],
              'index_http': os.environ['index_code'],
              'app_js_http': os.environ['app_code'],
              'package_capture_js_http': os.environ['package_code'],
              'image_quality_js_http': os.environ['quality_code'],
              'recognition_bridge_js_http': os.environ['bridge_code'],
              'v095_ui_js_http': os.environ['ui_code'],
              'layout_gear_js_http': os.environ['layout_code'],
              'professional_sensory_js_http': os.environ['sensory_code'],
              'recognition_css_http': os.environ['recognition_css_code'],
              'codebook_http': os.environ['codebook_code'],
              'release_http': os.environ['release_code'],
              'release_version': os.environ.get('release_version', ''),
              'release_source_sha': os.environ.get('release_source_sha', ''),
              'site_verified': os.environ['ok'] == 'true',
          }
          with open('luckybean/deployment-status.json', 'w', encoding='utf-8') as fh:
              json.dump(report, fh, ensure_ascii=False, indent=2)
              fh.write('\n')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
          [[ "$ok" == 'true' ]]

      - name: Commit deployment verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git add luckybean/deployment-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Lucky Bean web deployment status [skip ci]'
            git push origin HEAD:main
          fi
