name: Publish Lucky Bean stable web

on:
  push:
    branches: [main]
    paths:
      - '.luckybean-publish-trigger'
      - '.github/workflows/publish-luckybean-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-luckybean-web
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout BrewIon Pages repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout Lucky Bean main
        uses: actions/checkout@v4
        with:
          repository: zjcrop/luckybean
          ref: main
          path: _luckybean_source

      - name: Validate Lucky Bean v0.9.5 source
        working-directory: _luckybean_source
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          node --check src/app.js
          node --check src/v095-ui.js
          test "$(node -p "require('./package.json').version")" = '0.9.5'
          test -s index.html
          test -s styles.css
          test -s styles-v095.css
          test -s styles-action-grid.css
          test -s src/app.js
          test -s src/v095-ui.js
          test -s src/codebook.js
          test -s public/fallback-codebook.json
          test -s public/splash-red.jpg
          test -s public/splash-white.jpg
          test -s public/settings-mascot.png
          test -s public/action-grid.svg
          grep -q 'styles-v095.css?v=095' index.html
          grep -q 'styles-action-grid.css?v=095a' index.html
          grep -q 'src/v095-ui.js?v=095' index.html
          grep -q 'splash-red.jpg?v=095' index.html
          grep -q 'action-grid.svg?v=095a' styles-action-grid.css
          grep -q 'luckybean-v0.9.5' sw.js
          grep -q "'./styles-action-grid.css'" sw.js
          grep -q "'./public/action-grid.svg'" sw.js

      - name: Publish runtime under BrewIon/luckybean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf luckybean
          mkdir -p luckybean
          cp _luckybean_source/index.html luckybean/
          cp _luckybean_source/styles.css luckybean/
          cp _luckybean_source/styles-v095.css luckybean/
          cp _luckybean_source/styles-action-grid.css luckybean/
          cp _luckybean_source/manifest.webmanifest luckybean/
          cp _luckybean_source/sw.js luckybean/
          cp -R _luckybean_source/src luckybean/
          cp -R _luckybean_source/public luckybean/
          touch luckybean/.nojekyll

          source_sha="$(git -C _luckybean_source rev-parse HEAD)"
          app_version="$(node -p "require('./_luckybean_source/package.json').version")"
          echo "LUCKYBEAN_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "LUCKYBEAN_VERSION=$app_version" >> "$GITHUB_ENV"

          cat > luckybean/release.json <<EOF
          {
            "name": "Lucky Bean Web Stable",
            "version": "$app_version",
            "source_repository": "zjcrop/luckybean",
            "source_sha": "$source_sha",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "url": "https://zjcrop.github.io/BrewIon/luckybean/"
          }
          EOF
          rm -rf _luckybean_source

      - name: Commit verified web release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add luckybean
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish verified Lucky Bean web stable v${LUCKYBEAN_VERSION}"
            git push origin HEAD:main
          fi

      - name: Verify public Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://zjcrop.github.io/BrewIon/luckybean/'
          ok='false'
          index_code='000'; app_code='000'; ui_code='000'; css_code='000'; grid_css_code='000'
          red_code='000'; white_code='000'; mascot_code='000'; grid_svg_code='000'; codebook_code='000'; release_code='000'
          release_version=''; release_source_sha=''

          for attempt in $(seq 1 18); do
            nonce="$(date +%s)-$attempt"
            index_code="$(curl -L -sS -o /tmp/lb-index.html -w '%{http_code}' --max-time 20 "${base}?v=${nonce}" || true)"
            app_code="$(curl -L -sS -o /tmp/lb-app.js -w '%{http_code}' --max-time 20 "${base}src/app.js?v=${nonce}" || true)"
            ui_code="$(curl -L -sS -o /tmp/lb-v095.js -w '%{http_code}' --max-time 20 "${base}src/v095-ui.js?v=${nonce}" || true)"
            css_code="$(curl -L -sS -o /tmp/lb-v095.css -w '%{http_code}' --max-time 20 "${base}styles-v095.css?v=${nonce}" || true)"
            grid_css_code="$(curl -L -sS -o /tmp/lb-grid.css -w '%{http_code}' --max-time 20 "${base}styles-action-grid.css?v=${nonce}" || true)"
            red_code="$(curl -L -sS -o /tmp/lb-red.jpg -w '%{http_code}' --max-time 20 "${base}public/splash-red.jpg?v=${nonce}" || true)"
            white_code="$(curl -L -sS -o /tmp/lb-white.jpg -w '%{http_code}' --max-time 20 "${base}public/splash-white.jpg?v=${nonce}" || true)"
            mascot_code="$(curl -L -sS -o /tmp/lb-mascot.png -w '%{http_code}' --max-time 20 "${base}public/settings-mascot.png?v=${nonce}" || true)"
            grid_svg_code="$(curl -L -sS -o /tmp/lb-grid.svg -w '%{http_code}' --max-time 20 "${base}public/action-grid.svg?v=${nonce}" || true)"
            codebook_code="$(curl -L -sS -o /tmp/lb-codebook.json -w '%{http_code}' --max-time 20 "${base}public/fallback-codebook.json?v=${nonce}" || true)"
            release_code="$(curl -L -sS -o /tmp/lb-release.json -w '%{http_code}' --max-time 20 "${base}release.json?v=${nonce}" || true)"

            if [[ "$release_code" == '200' ]]; then
              release_version="$(python -c "import json; print(json.load(open('/tmp/lb-release.json', encoding='utf-8')).get('version', ''))" || true)"
              release_source_sha="$(python -c "import json; print(json.load(open('/tmp/lb-release.json', encoding='utf-8')).get('source_sha', ''))" || true)"
            fi

            if [[ "$index_code" == '200' && "$app_code" == '200' && "$ui_code" == '200' && "$css_code" == '200' && "$grid_css_code" == '200' \
              && "$red_code" == '200' && "$white_code" == '200' && "$mascot_code" == '200' && "$grid_svg_code" == '200' \
              && "$codebook_code" == '200' && "$release_code" == '200' \
              && "$release_version" == "$LUCKYBEAN_VERSION" && "$release_source_sha" == "$LUCKYBEAN_SOURCE_SHA" ]] \
              && grep -q '<title>富贵盒子</title>' /tmp/lb-index.html \
              && grep -q 'styles-v095.css' /tmp/lb-index.html \
              && grep -q 'styles-action-grid.css' /tmp/lb-index.html \
              && grep -q 'src/v095-ui.js' /tmp/lb-index.html \
              && grep -q 'const PAGE_META' /tmp/lb-app.js \
              && grep -q 'openSegmentedWizard' /tmp/lb-v095.js \
              && grep -q 'skipNativeToNote' /tmp/lb-v095.js \
              && grep -q '.v095-radar-handle' /tmp/lb-v095.css \
              && grep -q 'action-grid.svg' /tmp/lb-grid.css \
              && grep -q '四格快捷操作背景' /tmp/lb-grid.svg \
              && grep -q '"countries"' /tmp/lb-codebook.json; then
              ok='true'
              break
            fi
            sleep 10
          done

          export ok index_code app_code ui_code css_code grid_css_code red_code white_code mascot_code grid_svg_code codebook_code release_code release_version release_source_sha base
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          report = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'url': os.environ['base'],
              'expected_version': os.environ['LUCKYBEAN_VERSION'],
              'expected_source_sha': os.environ['LUCKYBEAN_SOURCE_SHA'],
              'index_http': os.environ['index_code'],
              'app_js_http': os.environ['app_code'],
              'v095_js_http': os.environ['ui_code'],
              'v095_css_http': os.environ['css_code'],
              'action_grid_css_http': os.environ['grid_css_code'],
              'splash_red_http': os.environ['red_code'],
              'splash_white_http': os.environ['white_code'],
              'settings_mascot_http': os.environ['mascot_code'],
              'action_grid_svg_http': os.environ['grid_svg_code'],
              'codebook_http': os.environ['codebook_code'],
              'release_http': os.environ['release_code'],
              'release_version': os.environ.get('release_version', ''),
              'release_source_sha': os.environ.get('release_source_sha', ''),
              'site_verified': os.environ['ok'] == 'true',
          }
          with open('luckybean/deployment-status.json', 'w', encoding='utf-8') as fh:
              json.dump(report, fh, ensure_ascii=False, indent=2)
              fh.write('\n')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
          [[ "$ok" == 'true' ]]

      - name: Commit deployment verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git add luckybean/deployment-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Lucky Bean web deployment status [skip ci]'
            git push origin HEAD:main
          fi
