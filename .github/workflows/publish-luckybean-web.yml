name: Publish Lucky Bean stable web

on:
  push:
    branches: [main]
    paths:
      - '.luckybean-publish-trigger'
      - '.github/workflows/publish-luckybean-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-luckybean-web
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout BrewIon Pages repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout Lucky Bean main
        uses: actions/checkout@v4
        with:
          repository: zjcrop/luckybean
          ref: main
          path: _luckybean_source
          fetch-depth: 0

      - name: Validate source and browser gates
        working-directory: _luckybean_source
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          for file in \
            src/app.js src/qr.js src/qr-core.js src/codebook.js \
            src/v096-web-ocr.js src/v096-package-capture.js src/v096-direct-camera.js \
            src/image-quality.js src/recognition-bridge.js src/v095-sensory-bootstrap.js \
            src/v095-sensory-pro.js src/v095-sensory-flow-guard.js src/v095-postbrew-sensory.js \
            src/v095-qr-ui.js src/v095-ui.js src/theme-bridge.js src/v095-layout-gear.js; do
            node --check "$file"
          done
          test "$(node -p "require('./package.json').version")" = '0.9.6'

          python - <<'PY'
          import json, subprocess
          checks = {
              'tests/sensory-browser-status.json': ('static_tests','browser_runtime','sensory_browser_smoke'),
              'tests/qr-postbrew-browser-status.json': ('static_tests','browser_runtime','postbrew_qr_browser_smoke'),
              'tests/ocr-qr-regression-status.json': (
                  'static_tests','browser_runtime','real_web_ocr_smoke','qr_text_first_regression',
                  'chinese_mixed_ocr','direct_camera_static'
              ),
          }
          for path, fields in checks.items():
              status = json.load(open(path, encoding='utf-8'))
              assert status.get('verified') is True, (path, status)
              for field in fields:
                  assert status.get(field) == 'success', (path, field, status)
              sha = status.get('source_sha', '')
              assert len(sha) == 40, (path, status)
              subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'], check=True)
          PY

          for file in \
            index.html styles.css styles-v095.css styles-action-grid.css styles-theme-light.css \
            styles-v095-refine.css styles-v096-recognition.css styles-qr-scan.css manifest.webmanifest sw.js \
            src/qr.js src/qr-core.js src/codebook.js src/v096-web-ocr.js \
            src/v096-package-capture.js src/v096-direct-camera.js \
            public/fallback-codebook.json public/splash-red.jpg public/splash-white.jpg \
            public/settings-mascot.png public/action-grid.svg; do
            test -s "$file"
          done

          grep -Fq 'styles-v096-recognition.css?v=096e' index.html
          grep -Fq 'src/app.js?v=096e' index.html
          grep -Fq 'src/v096-web-ocr.js?v=096e' index.html
          grep -Fq 'src/v096-package-capture.js?v=096e' index.html
          grep -Fq 'src/v096-direct-camera.js?v=096e' index.html
          grep -Fq "worker-src 'self' blob: https://cdn.jsdelivr.net" index.html
          grep -Fq 'decodeCodebookText' src/qr.js
          grep -Fq 'latin1Bytes' src/qr.js
          grep -Fq 'Text formats are authoritative' src/qr.js
          grep -Fq 'directCodeMatch' src/codebook.js
          grep -Fq 'normalizeCodeSource' src/codebook.js
          grep -Fq "return ['chi_sim', 'eng']" src/v096-web-ocr.js
          grep -Fq 'prepareOcrVariants' src/v096-web-ocr.js
          grep -Fq 'tessedit_pageseg_mode' src/v096-web-ocr.js
          grep -Fq 'tesseract.js-6.0.1-cn-mixed' src/v096-web-ocr.js
          grep -Fq 'navigator.mediaDevices.getUserMedia' src/v096-direct-camera.js
          grep -Fq 'new ImageCapture(track)' src/v096-direct-camera.js
          grep -Fq 'facingMode: { ideal: facingMode }' src/v096-direct-camera.js
          grep -Fq 'luckybean-v0.9.6-cn-ocr-camera-e' sw.js
          for asset in \
            './styles-v096-recognition.css' './src/v096-web-ocr.js' './src/v096-package-capture.js' \
            './src/v096-direct-camera.js' './src/qr.js' './src/qr-core.js' './src/codebook.js'; do
            grep -Fq "'$asset'" sw.js
          done

      - name: Publish runtime under BrewIon/luckybean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf luckybean
          mkdir -p luckybean
          cp _luckybean_source/index.html luckybean/
          cp _luckybean_source/styles.css luckybean/
          cp _luckybean_source/styles-v095.css luckybean/
          cp _luckybean_source/styles-action-grid.css luckybean/
          cp _luckybean_source/styles-theme-light.css luckybean/
          cp _luckybean_source/styles-v095-refine.css luckybean/
          cp _luckybean_source/styles-v096-recognition.css luckybean/
          cp _luckybean_source/styles-qr-scan.css luckybean/
          cp _luckybean_source/manifest.webmanifest luckybean/
          cp _luckybean_source/sw.js luckybean/
          cp -R _luckybean_source/src luckybean/
          cp -R _luckybean_source/public luckybean/
          touch luckybean/.nojekyll

          source_sha="$(git -C _luckybean_source rev-parse HEAD)"
          app_version="$(node -p "require('./_luckybean_source/package.json').version")"
          echo "LUCKYBEAN_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "LUCKYBEAN_VERSION=$app_version" >> "$GITHUB_ENV"
          cat > luckybean/release.json <<EOF
          {
            "name": "Lucky Bean Web Stable",
            "version": "$app_version",
            "source_repository": "zjcrop/luckybean",
            "source_sha": "$source_sha",
            "sensory_browser_verified": true,
            "postbrew_qr_browser_verified": true,
            "web_ocr_browser_verified": true,
            "chinese_mixed_ocr_verified": true,
            "qr_text_first_verified": true,
            "codebook_text_qr_verified": true,
            "direct_camera_verified": true,
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "url": "https://zjcrop.github.io/BrewIon/luckybean/"
          }
          EOF
          rm -rf _luckybean_source

      - name: Commit verified web release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add luckybean
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish Chinese OCR and direct camera hotfix v${LUCKYBEAN_VERSION}"
            git push origin HEAD:main
          fi

      - name: Verify public Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://zjcrop.github.io/BrewIon/luckybean/'
          ok='false'
          index_code='000'; ocr_code='000'; camera_code='000'; qr_code='000'; codebook_code='000'; sw_code='000'; release_code='000'
          release_version=''; release_source_sha=''; release_cn='false'; release_camera='false'; release_codebook='false'

          for attempt in $(seq 1 30); do
            nonce="$(date +%s)-$attempt"
            index_code="$(curl -L -sS -o /tmp/lb-index.html -w '%{http_code}' --max-time 20 "${base}?v=${nonce}" || true)"
            ocr_code="$(curl -L -sS -o /tmp/lb-ocr.js -w '%{http_code}' --max-time 20 "${base}src/v096-web-ocr.js?v=${nonce}" || true)"
            camera_code="$(curl -L -sS -o /tmp/lb-camera.js -w '%{http_code}' --max-time 20 "${base}src/v096-direct-camera.js?v=${nonce}" || true)"
            qr_code="$(curl -L -sS -o /tmp/lb-qr.js -w '%{http_code}' --max-time 20 "${base}src/qr.js?v=${nonce}" || true)"
            codebook_code="$(curl -L -sS -o /tmp/lb-codebook.js -w '%{http_code}' --max-time 20 "${base}src/codebook.js?v=${nonce}" || true)"
            sw_code="$(curl -L -sS -o /tmp/lb-sw.js -w '%{http_code}' --max-time 20 "${base}sw.js?v=${nonce}" || true)"
            release_code="$(curl -L -sS -o /tmp/lb-release.json -w '%{http_code}' --max-time 20 "${base}release.json?v=${nonce}" || true)"

            if [[ "$release_code" == '200' ]]; then
              readarray -t values < <(python - <<'PY'
          import json
          data=json.load(open('/tmp/lb-release.json', encoding='utf-8'))
          for key in ('version','source_sha','chinese_mixed_ocr_verified','direct_camera_verified','codebook_text_qr_verified'):
              value=data.get(key,'')
              print(str(value).lower() if isinstance(value,bool) else value)
          PY
              )
              release_version="${values[0]:-}"
              release_source_sha="${values[1]:-}"
              release_cn="${values[2]:-false}"
              release_camera="${values[3]:-false}"
              release_codebook="${values[4]:-false}"
            fi

            if [[ "$index_code" == '200' && "$ocr_code" == '200' && "$camera_code" == '200' \
              && "$qr_code" == '200' && "$codebook_code" == '200' && "$sw_code" == '200' && "$release_code" == '200' \
              && "$release_version" == "$LUCKYBEAN_VERSION" && "$release_source_sha" == "$LUCKYBEAN_SOURCE_SHA" \
              && "$release_cn" == 'true' && "$release_camera" == 'true' && "$release_codebook" == 'true' ]] \
              && grep -Fq 'src/v096-direct-camera.js?v=096e' /tmp/lb-index.html \
              && grep -Fq 'tesseract.js-6.0.1-cn-mixed' /tmp/lb-ocr.js \
              && grep -Fq "return ['chi_sim', 'eng']" /tmp/lb-ocr.js \
              && grep -Fq 'prepareOcrVariants' /tmp/lb-ocr.js \
              && grep -Fq 'navigator.mediaDevices.getUserMedia' /tmp/lb-camera.js \
              && grep -Fq 'new ImageCapture(track)' /tmp/lb-camera.js \
              && grep -Fq 'decodeCodebookText' /tmp/lb-qr.js \
              && grep -Fq 'latin1Bytes' /tmp/lb-qr.js \
              && grep -Fq 'directCodeMatch' /tmp/lb-codebook.js \
              && grep -Fq 'luckybean-v0.9.6-cn-ocr-camera-e' /tmp/lb-sw.js; then
              ok='true'
              break
            fi
            sleep 10
          done

          export ok base index_code ocr_code camera_code qr_code codebook_code sw_code release_code release_version release_source_sha release_cn release_camera release_codebook
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          report = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'url': os.environ['base'],
              'expected_version': os.environ['LUCKYBEAN_VERSION'],
              'expected_source_sha': os.environ['LUCKYBEAN_SOURCE_SHA'],
              'index_http': os.environ['index_code'],
              'web_ocr_js_http': os.environ['ocr_code'],
              'direct_camera_js_http': os.environ['camera_code'],
              'qr_wrapper_js_http': os.environ['qr_code'],
              'codebook_js_http': os.environ['codebook_code'],
              'service_worker_http': os.environ['sw_code'],
              'release_http': os.environ['release_code'],
              'release_version': os.environ.get('release_version',''),
              'release_source_sha': os.environ.get('release_source_sha',''),
              'chinese_mixed_ocr_verified': os.environ.get('release_cn') == 'true',
              'direct_camera_verified': os.environ.get('release_camera') == 'true',
              'codebook_text_qr_verified': os.environ.get('release_codebook') == 'true',
              'site_verified': os.environ['ok'] == 'true',
          }
          with open('luckybean/deployment-status.json','w',encoding='utf-8') as handle:
              json.dump(report,handle,ensure_ascii=False,indent=2)
              handle.write('\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          [[ "$ok" == 'true' ]]

      - name: Commit deployment verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git add luckybean/deployment-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Lucky Bean Chinese OCR camera deployment [skip ci]'
            git push origin HEAD:main
          fi
