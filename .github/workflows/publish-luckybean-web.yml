name: Publish Lucky Bean v1.0.0-alpha web

on:
  push:
    branches: [main]
    paths:
      - '.luckybean-publish-trigger'
      - '.github/workflows/publish-luckybean-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-luckybean-v1-alpha
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout BrewIon Pages repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout Lucky Bean source
        uses: actions/checkout@v4
        with:
          repository: zjcrop/luckybean
          ref: main
          path: _luckybean_source
          fetch-depth: 0

      - name: Validate v1.0.0-alpha source
        working-directory: _luckybean_source
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = '1.0.0-alpha'
          npm run check
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python - <<'PY'
          from pathlib import Path
          import json, re

          html = Path('index.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          manifest = json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          assert 'application-version" content="1.0.0-alpha' in html
          assert 'release-revision" content="1.0.0-alpha' in html
          assert 'data-release="1.0.0-alpha"' in html
          assert "const CACHE_NAME = 'luckybean-v1.0.0-alpha'" in sw
          assert "const RELEASE = '1.0.0-alpha'" in sw
          assert manifest['start_url'] == './?v=1.0.0-alpha'
          assert manifest['name'] == '富贵盒子 1.0.0-alpha'
          refs = re.findall(r'(?:src|href)="(\./[^"#?]+)', html)
          missing = [ref for ref in refs if not Path(ref[2:]).exists()]
          if missing:
              raise SystemExit(f'Missing HTML resources: {missing}')
          print(f'Validated {len(refs)} HTML resources.')
          PY

      - name: Publish web runtime and APK download
        shell: bash
        run: |
          set -euo pipefail
          rm -rf luckybean
          mkdir -p luckybean luckybean/downloads

          cp _luckybean_source/index.html luckybean/
          cp _luckybean_source/manifest.webmanifest luckybean/
          cp _luckybean_source/sw.js luckybean/
          find _luckybean_source -maxdepth 1 -type f -name '*.css' -exec cp {} luckybean/ \;
          cp -R _luckybean_source/src luckybean/
          cp -R _luckybean_source/public luckybean/
          touch luckybean/.nojekyll

          apk_url='https://github.com/zjcrop/luckybean/releases/download/v1.0.0-alpha/LuckyBean-v1.0.0-alpha-Android.apk'
          sha_url='https://github.com/zjcrop/luckybean/releases/download/v1.0.0-alpha/LuckyBean-v1.0.0-alpha-Android.apk.sha256'
          curl -L --fail --retry 5 --retry-delay 2 -o luckybean/downloads/LuckyBean-v1.0.0-alpha-Android.apk "$apk_url"
          curl -L --fail --retry 5 --retry-delay 2 -o luckybean/downloads/LuckyBean-v1.0.0-alpha-Android.apk.sha256 "$sha_url"
          expected="$(cut -d' ' -f1 luckybean/downloads/LuckyBean-v1.0.0-alpha-Android.apk.sha256)"
          actual="$(sha256sum luckybean/downloads/LuckyBean-v1.0.0-alpha-Android.apk | cut -d' ' -f1)"
          test "$actual" = "$expected"

          source_sha="$(git -C _luckybean_source rev-parse HEAD)"
          app_version="$(node -p "require('./_luckybean_source/package.json').version")"
          apk_bytes="$(stat --printf='%s' luckybean/downloads/LuckyBean-v1.0.0-alpha-Android.apk)"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > luckybean/release.json <<EOF
          {
            "name": "富贵盒子",
            "channel": "alpha",
            "version": "$app_version",
            "source_repository": "zjcrop/luckybean",
            "source_sha": "$source_sha",
            "web_url": "https://zjcrop.github.io/BrewIon/luckybean/",
            "apk_url": "https://zjcrop.github.io/BrewIon/luckybean/downloads/LuckyBean-v1.0.0-alpha-Android.apk",
            "github_release_url": "https://github.com/zjcrop/luckybean/releases/tag/v1.0.0-alpha",
            "apk_sha256": "$actual",
            "apk_bytes": $apk_bytes,
            "android_application_id": "com.luckybean.app",
            "android_version_code": 100001,
            "android_version_name": "1.0.0-alpha",
            "android_min_sdk": 26,
            "android_target_sdk": 35,
            "signing": "alpha-test-signing",
            "published_at": "$published_at"
          }
          EOF
          cat > luckybean/.release-status.json <<EOF
          {
            "status": "success",
            "version": "$app_version",
            "source_sha": "$source_sha",
            "apk_sha256": "$actual",
            "published_at": "$published_at"
          }
          EOF
          rm -rf _luckybean_source

      - name: Commit v1.0.0-alpha deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add luckybean
          if ! git diff --cached --quiet; then
            git commit -m 'release: publish Lucky Bean v1.0.0-alpha web and APK'
            git push origin HEAD:main
          fi

      - name: Verify committed deployment
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          grep -Fq 'application-version" content="1.0.0-alpha' luckybean/index.html
          grep -Fq "const CACHE_NAME = 'luckybean-v1.0.0-alpha'" luckybean/sw.js
          test -s luckybean/downloads/LuckyBean-v1.0.0-alpha-Android.apk
          python - <<'PY'
          import json
          data=json.load(open('luckybean/release.json', encoding='utf-8'))
          assert data['version']=='1.0.0-alpha'
          assert data['apk_sha256']=='5cea321974f8c67a1d55fb4b921d05d386cb1c039cf34e4071babb31f92b55dc'
          assert data['android_application_id']=='com.luckybean.app'
          print(data)
          PY
