name: Publish Lucky Bean stable web

on:
  push:
    branches: [main]
    paths:
      - '.luckybean-publish-trigger'
      - '.github/workflows/publish-luckybean-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-luckybean-web
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout BrewIon Pages repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout Lucky Bean main
        uses: actions/checkout@v4
        with:
          repository: zjcrop/luckybean
          ref: main
          path: _luckybean_source
          fetch-depth: 0

      - name: Validate source and browser gates
        working-directory: _luckybean_source
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          for file in \
            src/app.js src/qr.js src/qr-core.js src/codebook.js src/recognition-candidates.js \
            src/v096-web-ocr.js src/v096-package-capture.js src/v096-direct-camera.js src/v096-integrity-ui.js \
            src/brew-engine.js src/brew-engine-core.js src/brew-trajectory-v096.js \
            src/db.js src/db-storage-core.js src/sensory-codec-v096.js src/privacy-codec-v096.js \
            src/share-codec.js src/share-codec-core.js src/v095-sensory-bootstrap.js \
            src/v095-sensory-pro.js src/v095-sensory-flow-guard.js src/v095-postbrew-sensory.js \
            src/v095-qr-ui.js src/v095-ui.js src/theme-bridge.js src/v095-layout-gear.js; do
            node --check "$file"
          done
          test "$(node -p "require('./package.json').version")" = '0.9.6'

          python - <<'PY'
          import json, subprocess
          checks = {
              'tests/sensory-browser-status.json': ('static_tests','browser_runtime','sensory_browser_smoke'),
              'tests/qr-postbrew-browser-status.json': ('static_tests','browser_runtime','postbrew_qr_browser_smoke'),
              'tests/ocr-qr-regression-status.json': (
                  'static_tests','browser_runtime','real_web_ocr_smoke','qr_text_first_regression',
                  'chinese_mixed_ocr','direct_camera_static'
              ),
              'tests/integrity-browser-status.json': (
                  'static_tests','browser_runtime','integrity_browser_smoke','brew_profile_integrity',
                  'variable_trajectory','sensory_encrypted_storage','sensory_rich_history',
                  'minimal_identity_screen','direct_sensory_choice'
              ),
          }
          for path, fields in checks.items():
              status = json.load(open(path, encoding='utf-8'))
              assert status.get('verified') is True, (path, status)
              for field in fields:
                  assert status.get(field) == 'success', (path, field, status)
              sha = status.get('source_sha', '')
              assert len(sha) == 40, (path, status)
              subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'], check=True)
          PY

          for file in \
            index.html styles.css styles-v095.css styles-action-grid.css styles-theme-light.css \
            styles-v095-refine.css styles-v096-recognition.css styles-qr-scan.css styles-v096-integrity.css \
            manifest.webmanifest sw.js src/brew-engine.js src/brew-engine-core.js src/brew-trajectory-v096.js \
            src/db.js src/db-storage-core.js src/sensory-codec-v096.js src/privacy-codec-v096.js \
            src/share-codec.js src/share-codec-core.js src/recognition-candidates.js src/v096-integrity-ui.js \
            public/fallback-codebook.json public/splash-red.jpg public/splash-white.jpg \
            public/settings-mascot.png public/action-grid.svg; do
            test -s "$file"
          done

          grep -Fq 'styles-v096-integrity.css?v=096f' index.html
          grep -Fq 'src/v096-integrity-ui.js?v=096f' index.html
          grep -Fq '>登录<' index.html
          grep -Fq '>注册<' index.html
          grep -Fq '>本地使用<' index.html
          grep -Fq '>测试<' index.html
          grep -Fq 'luckybean-v0.9.6-integrity-f' sw.js
          grep -Fq 'time-stepped-variable-release' src/brew-trajectory-v096.js
          grep -Fq 'requestedProfileId' src/brew-engine.js
          grep -Fq 'AES-GCM-256' src/sensory-codec-v096.js
          grep -Fq 'LB-SENSORY-2' src/sensory-codec-v096.js
          grep -Fq 'delete value.sensoryNote' src/db.js
          grep -Fq 'sealPrivateJson(identity' src/db.js
          grep -Fq 'LB8${packed.code}.E.' src/share-codec.js
          grep -Fq 'data-evidence-field' src/v096-integrity-ui.js
          grep -Fq 'sensory-record-tags' src/v096-integrity-ui.js
          grep -Fq '#directSensoryBtn, #planToSensoryBtn' src/v096-integrity-ui.js
          grep -Fq "maxlength', '300" src/v096-integrity-ui.js
          for asset in \
            './styles-v096-integrity.css' './src/v096-integrity-ui.js' './src/recognition-candidates.js' \
            './src/sensory-codec-v096.js' './src/privacy-codec-v096.js' './src/brew-trajectory-v096.js' \
            './src/brew-engine-core.js' './src/db-storage-core.js' './src/share-codec-core.js'; do
            grep -Fq "'$asset'" sw.js
          done

      - name: Publish runtime under BrewIon/luckybean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf luckybean
          mkdir -p luckybean
          cp _luckybean_source/index.html luckybean/
          cp _luckybean_source/styles.css luckybean/
          cp _luckybean_source/styles-v095.css luckybean/
          cp _luckybean_source/styles-action-grid.css luckybean/
          cp _luckybean_source/styles-theme-light.css luckybean/
          cp _luckybean_source/styles-v095-refine.css luckybean/
          cp _luckybean_source/styles-v096-recognition.css luckybean/
          cp _luckybean_source/styles-qr-scan.css luckybean/
          cp _luckybean_source/styles-v096-integrity.css luckybean/
          cp _luckybean_source/manifest.webmanifest luckybean/
          cp _luckybean_source/sw.js luckybean/
          cp -R _luckybean_source/src luckybean/
          cp -R _luckybean_source/public luckybean/
          touch luckybean/.nojekyll

          source_sha="$(git -C _luckybean_source rev-parse HEAD)"
          app_version="$(node -p "require('./_luckybean_source/package.json').version")"
          echo "LUCKYBEAN_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "LUCKYBEAN_VERSION=$app_version" >> "$GITHUB_ENV"
          cat > luckybean/release.json <<EOF
          {
            "name": "Lucky Bean Web Stable",
            "version": "$app_version",
            "source_repository": "zjcrop/luckybean",
            "source_sha": "$source_sha",
            "sensory_browser_verified": true,
            "postbrew_qr_browser_verified": true,
            "web_ocr_browser_verified": true,
            "chinese_mixed_ocr_verified": true,
            "codebook_text_qr_verified": true,
            "direct_camera_verified": true,
            "brew_profile_integrity_verified": true,
            "variable_trajectory_verified": true,
            "sensory_encrypted_storage_verified": true,
            "sensory_rich_history_verified": true,
            "minimal_identity_screen_verified": true,
            "direct_sensory_choice_verified": true,
            "encrypted_share_verified": true,
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "url": "https://zjcrop.github.io/BrewIon/luckybean/"
          }
          EOF
          rm -rf _luckybean_source

      - name: Commit verified web release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add luckybean
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish Lucky Bean integrity runtime v${LUCKYBEAN_VERSION}"
            git push origin HEAD:main
          fi

      - name: Verify public Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://zjcrop.github.io/BrewIon/luckybean/'
          ok='false'
          for attempt in $(seq 1 30); do
            nonce="$(date +%s)-$attempt"
            declare -A urls=(
              [index]="${base}?v=${nonce}"
              [integrity]="${base}src/v096-integrity-ui.js?v=${nonce}"
              [trajectory]="${base}src/brew-trajectory-v096.js?v=${nonce}"
              [sensory]="${base}src/sensory-codec-v096.js?v=${nonce}"
              [privacy]="${base}src/privacy-codec-v096.js?v=${nonce}"
              [share]="${base}src/share-codec.js?v=${nonce}"
              [style]="${base}styles-v096-integrity.css?v=${nonce}"
              [sw]="${base}sw.js?v=${nonce}"
              [release]="${base}release.json?v=${nonce}"
            )
            all_200='true'
            for key in "${!urls[@]}"; do
              code="$(curl -L -sS -o "/tmp/lb-${key}" -w '%{http_code}' --max-time 20 "${urls[$key]}" || true)"
              export "HTTP_${key^^}=$code"
              [[ "$code" == '200' ]] || all_200='false'
            done
            if [[ "$HTTP_RELEASE" == '200' ]]; then
              readarray -t values < <(python - <<'PY'
          import json
          data=json.load(open('/tmp/lb-release', encoding='utf-8'))
          for key in (
              'version','source_sha','brew_profile_integrity_verified','variable_trajectory_verified',
              'sensory_encrypted_storage_verified','sensory_rich_history_verified',
              'minimal_identity_screen_verified','direct_sensory_choice_verified','encrypted_share_verified'
          ):
              value=data.get(key,'')
              print(str(value).lower() if isinstance(value,bool) else value)
          PY
              )
              if [[ "$all_200" == 'true' && "${values[0]:-}" == "$LUCKYBEAN_VERSION" && "${values[1]:-}" == "$LUCKYBEAN_SOURCE_SHA" \
                && "${values[2]:-false}" == 'true' && "${values[3]:-false}" == 'true' \
                && "${values[4]:-false}" == 'true' && "${values[5]:-false}" == 'true' \
                && "${values[6]:-false}" == 'true' && "${values[7]:-false}" == 'true' && "${values[8]:-false}" == 'true' ]] \
                && grep -Fq 'styles-v096-integrity.css?v=096f' /tmp/lb-index \
                && grep -Fq 'data-evidence-field' /tmp/lb-integrity \
                && grep -Fq 'time-stepped-variable-release' /tmp/lb-trajectory \
                && grep -Fq 'LB-SENSORY-2' /tmp/lb-sensory \
                && grep -Fq 'AES-GCM-256' /tmp/lb-privacy \
                && grep -Fq 'LB8${packed.code}.E.' /tmp/lb-share \
                && grep -Fq 'luckybean-v0.9.6-integrity-f' /tmp/lb-sw; then
                ok='true'
                break
              fi
            fi
            sleep 10
          done

          export ok base
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          report = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'url': os.environ['base'],
              'expected_version': os.environ['LUCKYBEAN_VERSION'],
              'expected_source_sha': os.environ['LUCKYBEAN_SOURCE_SHA'],
              'index_http': os.environ.get('HTTP_INDEX','000'),
              'integrity_ui_http': os.environ.get('HTTP_INTEGRITY','000'),
              'trajectory_model_http': os.environ.get('HTTP_TRAJECTORY','000'),
              'sensory_codec_http': os.environ.get('HTTP_SENSORY','000'),
              'privacy_codec_http': os.environ.get('HTTP_PRIVACY','000'),
              'share_codec_http': os.environ.get('HTTP_SHARE','000'),
              'integrity_style_http': os.environ.get('HTTP_STYLE','000'),
              'service_worker_http': os.environ.get('HTTP_SW','000'),
              'release_http': os.environ.get('HTTP_RELEASE','000'),
              'brew_profile_integrity_verified': os.environ['ok'] == 'true',
              'variable_trajectory_verified': os.environ['ok'] == 'true',
              'sensory_encrypted_storage_verified': os.environ['ok'] == 'true',
              'sensory_rich_history_verified': os.environ['ok'] == 'true',
              'minimal_identity_screen_verified': os.environ['ok'] == 'true',
              'direct_sensory_choice_verified': os.environ['ok'] == 'true',
              'encrypted_share_verified': os.environ['ok'] == 'true',
              'site_verified': os.environ['ok'] == 'true'
          }
          with open('luckybean/deployment-status.json','w',encoding='utf-8') as handle:
              json.dump(report,handle,ensure_ascii=False,indent=2)
              handle.write('\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          [[ "$ok" == 'true' ]]

      - name: Commit deployment verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git add luckybean/deployment-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Lucky Bean integrity deployment [skip ci]'
            git push origin HEAD:main
          fi
