name: Publish Lucky Bean stable web

on:
  push:
    branches: [main]
    paths:
      - '.luckybean-publish-trigger'
      - '.github/workflows/publish-luckybean-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-luckybean-web
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout BrewIon Pages repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout verified Lucky Bean source
        uses: actions/checkout@v4
        with:
          repository: zjcrop/luckybean
          ref: main
          path: _luckybean_source

      - name: Validate Lucky Bean web source
        working-directory: _luckybean_source
        run: |
          set -euo pipefail
          npm test
          npm run check
          test -s index.html
          test -s styles.css
          test -s src/app.js
          test -s public/fallback-codebook.json

      - name: Publish runtime files under BrewIon/luckybean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf luckybean
          mkdir -p luckybean
          cp _luckybean_source/index.html luckybean/
          cp _luckybean_source/styles.css luckybean/
          cp _luckybean_source/manifest.webmanifest luckybean/
          cp _luckybean_source/sw.js luckybean/
          cp -R _luckybean_source/src luckybean/
          cp -R _luckybean_source/public luckybean/
          touch luckybean/.nojekyll
          source_sha="$(git -C _luckybean_source rev-parse HEAD)"
          cat > luckybean/release.json <<EOF
          {
            "name": "Lucky Bean Web Stable",
            "version": "0.6.0",
            "source_repository": "zjcrop/luckybean",
            "source_sha": "$source_sha",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "url": "https://zjcrop.github.io/BrewIon/luckybean/"
          }
          EOF
          rm -rf _luckybean_source

      - name: Commit verified web release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add luckybean
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish verified Lucky Bean web stable'
            git push origin HEAD:main
          fi

      - name: Verify public Pages deployment
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          base='https://zjcrop.github.io/BrewIon/luckybean/'
          ok='false'
          index_code='000'
          app_code='000'
          data_code='000'
          for attempt in $(seq 1 18); do
            nonce="$(date +%s)-$attempt"
            index_code="$(curl -L -sS -o /tmp/luckybean-index.html -w '%{http_code}' --max-time 20 "${base}?v=${nonce}" || true)"
            app_code="$(curl -L -sS -o /tmp/luckybean-app.js -w '%{http_code}' --max-time 20 "${base}src/app.js?v=${nonce}" || true)"
            data_code="$(curl -L -sS -o /tmp/luckybean-codebook.json -w '%{http_code}' --max-time 20 "${base}public/fallback-codebook.json?v=${nonce}" || true)"
            if [[ "$index_code" == '200' ]] \
              && [[ "$app_code" == '200' ]] \
              && [[ "$data_code" == '200' ]] \
              && grep -q '<title>富贵盒子</title>' /tmp/luckybean-index.html \
              && grep -q "藏" /tmp/luckybean-index.html \
              && grep -q 'const PAGE_META' /tmp/luckybean-app.js \
              && grep -q '"countries"' /tmp/luckybean-codebook.json; then
              ok='true'
              break
            fi
            sleep 10
          done
          export ok index_code app_code data_code base
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          report = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'url': os.environ['base'],
              'index_http': os.environ['index_code'],
              'app_js_http': os.environ['app_code'],
              'codebook_http': os.environ['data_code'],
              'title_found': os.environ['ok'] == 'true',
              'site_verified': os.environ['ok'] == 'true',
          }
          with open('luckybean/deployment-status.json', 'w', encoding='utf-8') as fh:
              json.dump(report, fh, ensure_ascii=False, indent=2)
              fh.write('\n')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
          [[ "$ok" == 'true' ]]

      - name: Commit deployment verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git add luckybean/deployment-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Lucky Bean web deployment status [skip ci]'
            git push origin HEAD:main
          fi
