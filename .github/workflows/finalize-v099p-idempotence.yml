name: Make deployed 099p settings rebuild idempotent

on:
  push:
    paths:
      - .github/workflows/finalize-v099p-idempotence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch controller
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('luckybean/src/v099p-settings-rebuild.js')
          text = path.read_text(encoding='utf-8')
          old = '''    const sections = normalizeSections(container);
              if (!sections) return;
              bindAccordion(container);'''
          new = '''    const keys = new Set(topLevel(container).map(categoryKey));
              const ready = ['appearance', 'account', 'gear', 'voice', 'data', 'about'].every(key => keys.has(key));
              const sections = ready ? {
                appearance: container.querySelector(':scope > [data-settings-key="appearance"]'),
                account: container.querySelector(':scope > [data-settings-key="account"]'),
                gear: container.querySelector(':scope > [data-settings-key="gear"]'),
                voice: container.querySelector(':scope > [data-settings-key="voice"]'),
                data: container.querySelector(':scope > [data-settings-key="data"]'),
                about: container.querySelector(':scope > [data-settings-key="about"]')
              } : normalizeSections(container);
              if (!sections) return;
              bindAccordion(container);'''
          if old not in text:
              if "const ready = ['appearance', 'account', 'gear', 'voice', 'data', 'about']" in text:
                  raise SystemExit(0)
              raise SystemExit('mount block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check luckybean/src/v099p-settings-rebuild.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add luckybean/src/v099p-settings-rebuild.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "deploy: make settings mount idempotent"
          git push
