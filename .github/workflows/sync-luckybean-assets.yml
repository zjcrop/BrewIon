name: Sync Lucky Bean assets

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-luckybean-assets.yml

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v4

      - name: Download current WebP assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p luckybean/public
          base="https://raw.githubusercontent.com/zjcrop/luckybean/main/public"
          curl --fail --location --retry 3 "$base/splash-art-red.webp" -o luckybean/public/splash-art-red.webp
          curl --fail --location --retry 3 "$base/splash-art-light.webp" -o luckybean/public/splash-art-light.webp
          curl --fail --location --retry 3 "$base/settings-mascot.webp" -o luckybean/public/settings-mascot.webp
          rm -f luckybean/public/settings-mascot.png

      - name: Commit synchronized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add luckybean/public/splash-art-red.webp luckybean/public/splash-art-light.webp luckybean/public/settings-mascot.webp luckybean/public/settings-mascot.png
          if git diff --cached --quiet; then
            echo "Assets are already synchronized."
            exit 0
          fi
          git commit -m "deploy: synchronize Lucky Bean WebP assets"
          git push
