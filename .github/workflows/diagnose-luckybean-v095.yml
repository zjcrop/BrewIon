name: Diagnose Lucky Bean v0.9.5 refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-luckybean-v095.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: zjcrop/luckybean
          ref: main
          path: _source
      - name: Run and capture diagnostics
        shell: bash
        run: |
          set +e
          log="$GITHUB_WORKSPACE/luckybean/diagnostic-v095.txt"
          mkdir -p "$GITHUB_WORKSPACE/luckybean"
          : > "$log"
          run_check() {
            label="$1"; shift
            echo "===== $label =====" | tee -a "$log"
            "$@" >> "$log" 2>&1
            code=$?
            echo "exit=$code" | tee -a "$log"
            return 0
          }
          cd _source
          run_check 'npm test' npm test
          run_check 'npm run check' npm run check
          run_check 'node check layout' node --check src/v095-layout-gear.js
          run_check 'node check sensory' node --check src/v095-sensory-pro.js
          run_check 'test marker' grep -F '专业品鉴' src/v095-sensory-pro.js
          run_check 'cache marker' grep -F 'luckybean-v0.9.5-refine3' sw.js
          cd "$GITHUB_WORKSPACE"
      - name: Commit diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add luckybean/diagnostic-v095.txt
          git commit -m 'chore: record temporary Lucky Bean validation diagnostics [skip ci]'
          git push origin HEAD:main
