name: Import Brew Profiles Web App

on:
  pull_request:
    paths:
      - '.brew-profiles-import-trigger'
      - '.github/workflows/import-brew-profiles-web.yml'

permissions:
  contents: write

concurrency:
  group: import-brew-profiles-web
  cancel-in-progress: false

jobs:
  import-web-assets:
    if: github.event.pull_request.title == 'chore: import Brew Profiles web assets'
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-12c0-81fd-87ff-bf4f6dfb304a/raw?se=2026-07-27T13:56:54Z&sp=r&sv=2026-02-06&sr=b&scid=d7076826-b2bb-5e64-b71b-bae14197550c&skoid=b9a47e8b-72a2-4ed3-8028-a2a98c1a6142&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-26T13:52:31Z&ske=2026-07-28T13:52:31Z&sks=b&skv=2026-02-06&sig=N/oJuiBbEpKo503CAh0bch%2BKUskTkTKczFxI4mG8umo%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Download verified APK artifact
        run: curl --fail --location --retry 3 "$ARTIFACT_URL" --output artifact.zip
      - name: Extract identical web assets from APK
        run: |
          rm -rf .import-tmp brew-profiles
          mkdir -p .import-tmp/artifact .import-tmp/apk brew-profiles
          unzip -q artifact.zip -d .import-tmp/artifact
          APK_FILE="$(find .import-tmp/artifact -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK_FILE"
          unzip -q "$APK_FILE" 'assets/web/*' -d .import-tmp/apk
          cp -a .import-tmp/apk/assets/web/. brew-profiles/
          test -s brew-profiles/index.html
          test -s brew-profiles/manifest.webmanifest
      - name: Remove one-time importer and commit web directory
        run: |
          rm -rf .import-tmp artifact.zip
          rm -f .brew-profiles-import-trigger .github/workflows/import-brew-profiles-web.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: publish Brew Profiles web app'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
