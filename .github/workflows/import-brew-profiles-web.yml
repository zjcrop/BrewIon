name: Import Brew Profiles Web App

on:
  push:
    branches: [main]
    paths:
      - '.brew-profiles-import-trigger-main'

permissions:
  contents: write

concurrency:
  group: import-brew-profiles-web
  cancel-in-progress: false

jobs:
  import-web-assets:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-de44-81fd-b687-14a1df74529a/raw?se=2026-08-04T05:14:50Z&sp=r&sv=2026-02-06&sr=b&scid=a5d2e5dd-0ce9-5fd5-9d33-1e7efd743c25&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-03T23:00:17Z&ske=2026-08-04T23:00:17Z&sks=b&skv=2026-02-06&sig=mxKJ%2BYXSBJJMlmnrHMj%2B1dSLKhZ0zwHm3Ks7xhD8LvY%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download verified APK artifact
        run: curl --fail --location --retry 3 "$ARTIFACT_URL" --output artifact.zip
      - name: Extract identical web assets from APK
        run: |
          rm -rf .import-tmp brew-profiles
          mkdir -p .import-tmp/artifact .import-tmp/apk brew-profiles
          unzip -q artifact.zip -d .import-tmp/artifact
          APK_FILE="$(find .import-tmp/artifact -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK_FILE"
          unzip -q "$APK_FILE" 'assets/web/*' -d .import-tmp/apk
          cp -a .import-tmp/apk/assets/web/. brew-profiles/
          test -s brew-profiles/index.html
          test -s brew-profiles/competition-2026.html
          test -s brew-profiles/manifest.webmanifest
      - name: Commit web directory and remove one-time importer
        run: |
          rm -rf .import-tmp artifact.zip
          rm -f .brew-profiles-import-trigger-main
          rm -f .github/workflows/import-brew-profiles-web.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: publish Brew Profiles web app with 2026 competition profiles'
          git push origin HEAD:main
