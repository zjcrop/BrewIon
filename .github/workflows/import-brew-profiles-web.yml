name: Import Brew Profiles Web App

on:
  push:
    branches: [main]
    paths:
      - '.brew-profiles-import-trigger-main'

permissions:
  contents: write

concurrency:
  group: import-brew-profiles-web
  cancel-in-progress: false

jobs:
  import-web-assets:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-0ccc-81fd-aa87-b7888f8d4d99/raw?se=2026-07-27T14:12:10Z&sp=r&sv=2026-02-06&sr=b&scid=968df0f3-e327-56cf-b21c-c3378810f488&skoid=b9a47e8b-72a2-4ed3-8028-a2a98c1a6142&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-27T12:13:00Z&ske=2026-07-29T12:13:00Z&sks=b&skv=2026-02-06&sig=YL0KlreL4rJ9VDn9tRDfRXAv5Wfkm4h4Ot6SXrywWlE%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download verified APK artifact
        run: curl --fail --location --retry 3 "$ARTIFACT_URL" --output artifact.zip
      - name: Extract identical web assets from APK
        run: |
          rm -rf .import-tmp brew-profiles
          mkdir -p .import-tmp/artifact .import-tmp/apk brew-profiles
          unzip -q artifact.zip -d .import-tmp/artifact
          APK_FILE="$(find .import-tmp/artifact -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK_FILE"
          unzip -q "$APK_FILE" 'assets/web/*' -d .import-tmp/apk
          cp -a .import-tmp/apk/assets/web/. brew-profiles/
          test -s brew-profiles/index.html
          test -s brew-profiles/manifest.webmanifest
      - name: Commit web directory and remove one-time importer
        run: |
          rm -rf .import-tmp artifact.zip
          rm -f .brew-profiles-import-trigger-main
          rm -f .github/workflows/import-brew-profiles-web.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: publish Brew Profiles web app'
          git push origin HEAD:main
