name: Deploy 099r OCR and freshness collapse fix

on:
  push:
    paths:
      - .github/workflows/release-099r-ocr-collapse.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('luckybean/index.html')
          html = index.read_text(encoding='utf-8')
          old_csp = "script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net"
          new_csp = "script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net"
          if old_csp in html:
              html = html.replace(old_csp, new_csp, 1)
          elif new_csp not in html:
              raise SystemExit('CSP script-src pattern not found')
          html = html.replace('099q', '099r')
          index.write_text(html, encoding='utf-8')

          sw = Path('luckybean/sw.js')
          sw_text = sw.read_text(encoding='utf-8').replace('099q', '099r')
          sw.write_text(sw_text, encoding='utf-8')

          group = Path('luckybean/src/v099i-freshness-group.js')
          text = group.read_text(encoding='utf-8')
          old = '<div class="group-collapse-zone"><button class="group-collapse" type="button" data-v099m-stage-back>收</button></div>'
          new = '<div class="group-collapse-zone" data-v099m-stage-back><button class="group-collapse" type="button" data-v099m-stage-back>收</button></div>'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('freshness collapse markup not found')
          group.write_text(text, encoding='utf-8')
          PY
          node --check luckybean/src/v099i-freshness-group.js
          grep -q "'unsafe-eval' 'wasm-unsafe-eval'" luckybean/index.html
          grep -q 'data-v099m-stage-back><button' luckybean/src/v099i-freshness-group.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add luckybean/index.html luckybean/sw.js luckybean/src/v099i-freshness-group.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "deploy: enable PP-OCR runtime and repair freshness collapse"
          git push
