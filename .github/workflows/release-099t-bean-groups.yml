name: Deploy 099t bean groups

on:
  push:
    paths:
      - .github/workflows/release-099t-bean-groups.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync group engine and patch deployed runtime
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/zjcrop/luckybean/main/src/v099t-bean-groups.js -o luckybean/src/v099t-bean-groups.js
          python - <<'PY'
          from pathlib import Path
          import re

          old = Path('luckybean/src/v098-feature-fixes.js')
          text = old.read_text(encoding='utf-8')
          text, count = re.subn(r'function queueGroups\(\) \{.*?\n\}', "function queueGroups() {\n  // 099t owns custom grouping. Do not recompute groups from the global DOM observer.\n  return;\n}", text, count=1, flags=re.S)
          if count != 1 and '099t owns custom grouping' not in text:
              raise SystemExit('queueGroups patch failed')
          old.write_text(text, encoding='utf-8')

          menu = Path('luckybean/src/v099m-group-controller.js')
          text = menu.read_text(encoding='utf-8')
          text = text.replace("remaining: ratioMode !== 'freshness-ratio' && legacyMode === 'remaining-50'", "remaining: ratioMode === 'remaining-50' || (ratioMode !== 'freshness-ratio' && legacyMode === 'remaining-50')")
          menu.write_text(text, encoding='utf-8')

          index = Path('luckybean/index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('./src/v099i-freshness-group.js', './src/v099t-bean-groups.js')
          text = text.replace('099s', '099t')
          index.write_text(text, encoding='utf-8')

          sw = Path('luckybean/sw.js')
          text = sw.read_text(encoding='utf-8')
          text = text.replace('./src/v099i-freshness-group.js', './src/v099t-bean-groups.js')
          text = text.replace('099s', '099t')
          sw.write_text(text, encoding='utf-8')
          PY
          node --check luckybean/src/v099t-bean-groups.js
          node --check luckybean/src/v098-feature-fixes.js
          node --check luckybean/src/v099m-group-controller.js
          node --check luckybean/sw.js
      - name: Commit deployment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add luckybean/src/v099t-bean-groups.js luckybean/src/v098-feature-fixes.js luckybean/src/v099m-group-controller.js luckybean/index.html luckybean/sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "deploy: preserve leaderboard and cache custom bean groups"
          git push
