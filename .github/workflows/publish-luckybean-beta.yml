name: Publish Lucky Bean Beta web

on:
  push:
    branches: [main]
    paths:
      - '.luckybean-beta-publish-trigger'
      - '.github/workflows/publish-luckybean-beta.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-luckybean-beta-web
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout BrewIon Pages repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout Lucky Bean Beta source
        uses: actions/checkout@v4
        with:
          repository: zjcrop/luckybean
          ref: beta/v0.8.0
          path: _luckybean_beta

      - name: Validate Beta source
        working-directory: _luckybean_beta
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0-beta.1') process.exit(1)"
          test -s index.html
          test -s styles.css
          test -s src/app.js
          test -s src/brew-engine.js
          test -s src/water-profiles.js
          test -s src/preference-model.js
          test -s src/share-codec.js
          test -s public/fallback-codebook.json

      - name: Publish isolated Beta runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf luckybean-beta
          mkdir -p luckybean-beta
          cp _luckybean_beta/index.html luckybean-beta/
          cp _luckybean_beta/styles.css luckybean-beta/
          cp _luckybean_beta/manifest.webmanifest luckybean-beta/
          cp _luckybean_beta/sw.js luckybean-beta/
          cp -R _luckybean_beta/src luckybean-beta/
          cp -R _luckybean_beta/public luckybean-beta/
          touch luckybean-beta/.nojekyll
          source_sha="$(git -C _luckybean_beta rev-parse HEAD)"
          version="$(node -p "require('./_luckybean_beta/package.json').version")"
          cat > luckybean-beta/release.json <<EOF
          {
            "name": "Lucky Bean Web Beta",
            "version": "$version",
            "source_repository": "zjcrop/luckybean",
            "source_branch": "beta/v0.8.0",
            "source_sha": "$source_sha",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "url": "https://zjcrop.github.io/BrewIon/luckybean-beta/"
          }
          EOF
          rm -rf _luckybean_beta

      - name: Commit verified Beta release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add luckybean-beta
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish Lucky Bean web beta v0.8.0-beta.1'
            git push origin HEAD:main
          fi

      - name: Verify public Beta deployment
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          base='https://zjcrop.github.io/BrewIon/luckybean-beta/'
          expected_version='0.8.0-beta.1'
          expected_source_sha='df1113436a72f4f3025e777d977ea5077dfe8825'
          ok='false'
          index_code='000'
          app_code='000'
          engine_code='000'
          water_code='000'
          preference_code='000'
          share_code='000'
          data_code='000'
          release_code='000'
          release_version=''
          release_source_sha=''
          for attempt in $(seq 1 24); do
            nonce="$(date +%s)-$attempt"
            index_code="$(curl -L -sS -o /tmp/lb-beta-index.html -w '%{http_code}' --max-time 20 "${base}?v=${nonce}" || true)"
            app_code="$(curl -L -sS -o /tmp/lb-beta-app.js -w '%{http_code}' --max-time 20 "${base}src/app.js?v=${nonce}" || true)"
            engine_code="$(curl -L -sS -o /tmp/lb-beta-engine.js -w '%{http_code}' --max-time 20 "${base}src/brew-engine.js?v=${nonce}" || true)"
            water_code="$(curl -L -sS -o /tmp/lb-beta-water.js -w '%{http_code}' --max-time 20 "${base}src/water-profiles.js?v=${nonce}" || true)"
            preference_code="$(curl -L -sS -o /tmp/lb-beta-preference.js -w '%{http_code}' --max-time 20 "${base}src/preference-model.js?v=${nonce}" || true)"
            share_code="$(curl -L -sS -o /tmp/lb-beta-share.js -w '%{http_code}' --max-time 20 "${base}src/share-codec.js?v=${nonce}" || true)"
            data_code="$(curl -L -sS -o /tmp/lb-beta-codebook.json -w '%{http_code}' --max-time 20 "${base}public/fallback-codebook.json?v=${nonce}" || true)"
            release_code="$(curl -L -sS -o /tmp/lb-beta-release.json -w '%{http_code}' --max-time 20 "${base}release.json?v=${nonce}" || true)"
            if [[ "$release_code" == '200' ]]; then
              release_version="$(python -c "import json; print(json.load(open('/tmp/lb-beta-release.json')).get('version',''))" 2>/dev/null || true)"
              release_source_sha="$(python -c "import json; print(json.load(open('/tmp/lb-beta-release.json')).get('source_sha',''))" 2>/dev/null || true)"
            fi
            if [[ "$index_code" == '200' && "$app_code" == '200' && "$engine_code" == '200' && "$water_code" == '200' && "$preference_code" == '200' && "$share_code" == '200' && "$data_code" == '200' && "$release_code" == '200' ]] \
              && grep -q '<title>富贵盒子' /tmp/lb-beta-index.html \
              && grep -q '拾味' /tmp/lb-beta-index.html \
              && grep -q '撷' /tmp/lb-beta-index.html \
              && grep -q 'lucky-brew-compat-0.8.0-beta' /tmp/lb-beta-engine.js \
              && grep -q 'brew-water-2.7-compat-0.8.0-beta' /tmp/lb-beta-water.js \
              && grep -q 'LB8' /tmp/lb-beta-share.js \
              && [[ "$release_version" == "$expected_version" ]] \
              && [[ "$release_source_sha" == "$expected_source_sha" ]]; then
              ok='true'
              break
            fi
            sleep 10
          done
          export base expected_version expected_source_sha ok index_code app_code engine_code water_code preference_code share_code data_code release_code release_version release_source_sha
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          report = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'url': os.environ['base'],
              'expected_version': os.environ['expected_version'],
              'expected_source_sha': os.environ['expected_source_sha'],
              'index_http': os.environ['index_code'],
              'app_js_http': os.environ['app_code'],
              'brew_engine_http': os.environ['engine_code'],
              'water_profiles_http': os.environ['water_code'],
              'preference_model_http': os.environ['preference_code'],
              'share_codec_http': os.environ['share_code'],
              'codebook_http': os.environ['data_code'],
              'release_http': os.environ['release_code'],
              'release_version': os.environ['release_version'],
              'release_source_sha': os.environ['release_source_sha'],
              'site_verified': os.environ['ok'] == 'true',
          }
          with open('luckybean-beta/deployment-status.json', 'w', encoding='utf-8') as fh:
              json.dump(report, fh, ensure_ascii=False, indent=2)
              fh.write('\n')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
          [[ "$ok" == 'true' ]]

      - name: Commit Beta deployment verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git add luckybean-beta/deployment-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Lucky Bean beta deployment status [skip ci]'
            git push origin HEAD:main
          fi
