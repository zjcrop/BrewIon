<!doctype html>
<html lang="zh-CN" data-auth-gate="checking">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080909">
  <meta name="application-version" content="1.0.9-test">
  <meta name="release-revision" content="1.0.9-test-gated-fast-auth">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://raw.githubusercontent.com https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>富贵盒子 1.0.9-test</title>
  <link rel="manifest" href="./manifest.webmanifest?v=1.0.9-test">
  <link rel="icon" href="./public/app-logo.webp?v=1.0.9-test" type="image/webp">
  <link rel="apple-touch-icon" href="./public/app-logo.webp?v=1.0.9-test">
  <link rel="stylesheet" href="./styles.css?v=1.0.9-test">
  <style id="authGateCritical">
    html[data-auth-gate="checking"] #splashScreen{display:flex!important}
    html[data-auth-gate="checking"] #loginScreen,html[data-auth-gate="checking"] #appShell{display:none!important}
    html[data-auth-gate="login"] #splashScreen,html[data-auth-gate="login"] #appShell{display:none!important}
    html[data-auth-gate="login"] #loginScreen{display:flex!important}
    html[data-auth-gate="ready"] #splashScreen,html[data-auth-gate="ready"] #loginScreen{display:none!important}
    html[data-auth-gate="ready"] #appShell{display:block!important}
    #splashStatus{position:absolute;left:20px;right:20px;bottom:max(34px,calc(20px + env(safe-area-inset-bottom)));text-align:center;color:#f5ead2;font-size:13px;letter-spacing:.08em;text-shadow:0 2px 10px rgba(0,0,0,.72)}
    #loginStatus{margin:0 0 12px;text-align:center;color:#bdb7aa;font-size:13px;line-height:1.6}
    #retryAuthBtn{width:100%;margin-top:8px}
    .auth-secondary-entry{display:none!important}
  </style>
</head>
<body data-release="1.0.9-test" data-release-revision="1.0.9-test-gated-fast-auth">
  <section id="splashScreen" class="splash-screen" data-splash-variant="red" role="status" aria-live="polite" aria-label="正在验证富贵盒子账号">
    <img id="splashImage" src="./public/splash-art-red.webp?v=1.0.9-test" alt="富贵盒子红色启动画面" loading="eager" decoding="async" fetchpriority="high">
    <span id="splashStatus">正在验证账号…</span>
  </section>
  <section id="loginScreen" class="login-screen hidden" aria-label="账号登录">
    <div class="login-card">
      <input id="loginNickname" type="hidden" value="本地用户">
      <p id="loginStatus">请登录后进入富贵盒子。</p>
      <div class="login-actions" aria-label="身份入口">
        <button id="emailIdentityBtn" class="button primary" type="button">登录</button>
        <button id="wechatIdentityBtn" class="button" type="button">注册</button>
        <button id="retryAuthBtn" class="button subtle" type="button">重试账号验证</button>
        <button id="guestBtn" class="button auth-secondary-entry" type="button">本地使用</button>
        <button id="testBtn" class="button subtle auth-secondary-entry" type="button">测试</button>
      </div>
    </div>
  </section>
  <div id="appShell" class="app-shell hidden">
    <main id="mainContent" class="main-content">
      <section id="pageBeans" class="page active" data-page="beans" aria-labelledby="titleBeans"><div class="page-heading centered-page-heading beans-page-heading"><div class="page-seal-slot"><h1 id="titleBeans" class="page-seal">豆藏</h1></div><div class="top-controls"><button class="small-control" id="groupBtn" type="button">分组</button><button class="small-control" id="manageBtn" type="button">管理</button><button class="theme-toggle" id="themeToggleBtn" type="button" aria-label="切换到白色模式"></button></div></div><div id="activeFilterBar" class="active-filter-bar hidden"></div><div id="beanGroups" class="bean-groups" aria-live="polite"></div></section>
      <section id="pageBrew" class="page" data-page="brew" aria-labelledby="titleBrew"><div class="page-heading centered-page-heading brew-page-heading"><div class="page-seal-slot"><h1 id="titleBrew" class="page-seal">小酌</h1></div><div id="brewHeadingBean" class="brew-heading-bean"></div></div><div id="brewContent"></div></section>
      <section id="pageSensory" class="page" data-page="sensory" aria-labelledby="titleSensory"><div class="page-heading centered-page-heading"><div><h1 id="titleSensory" class="page-seal">品鉴</h1></div></div><div id="sensoryContent"></div></section>
      <section id="pageSettings" class="page" data-page="settings" aria-labelledby="titleSettings"><div class="page-heading centered-page-heading"><div><h1 id="titleSettings" class="page-seal">器设</h1></div></div><div id="settingsContent"></div></section>
    </main>
    <div id="fabWrap" class="fab-wrap action-grid" aria-label="豆藏快捷操作"><button id="fabSearchBtn" class="fab text-fab" type="button" aria-label="搜索豆卡">搜索</button><button id="fabAddBtn" class="fab text-fab" type="button" aria-label="新增豆卡">添丁</button><button id="fabHistoryBtn" class="fab text-fab" type="button" aria-label="追溯往昔记录">溯旧</button><button id="fabRecommendBtn" class="fab text-fab" type="button" aria-label="选择推荐豆卡">选择</button></div>
    <nav id="bottomNav" class="bottom-nav" aria-label="主页面"><button class="nav-button active" type="button" data-page-target="beans" aria-label="豆藏：咖啡豆管理" aria-current="page"><span>藏</span></button><button class="nav-button" type="button" data-page-target="brew" aria-label="小酌：冲煮制作"><span>酌</span></button><button class="nav-button" type="button" data-page-target="sensory" aria-label="品鉴：感官评价"><span>鉴</span></button><button class="nav-button" type="button" data-page-target="settings" aria-label="器设：设备与系统设置"><span>器</span></button></nav>
  </div>
  <div id="v099fBeanModules" hidden aria-hidden="true"></div>
  <input id="qrImageInput" type="file" accept="image/*" capture="environment" class="hidden"><input id="importInput" type="file" accept="application/json" class="hidden"><div id="overlayRoot"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./src/theme-bridge.js?v=1.0.9-test"></script>
